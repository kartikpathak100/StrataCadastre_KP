# ============================================================================
# nginx.conf — serves the built viewer and reverse-proxies the API.
# Copied to /etc/nginx/conf.d/default.conf by Dockerfile.web.
#
# The frontend and API are served from the SAME ORIGIN, so the browser never
# makes a cross-origin request and no CORS middleware is required. This is
# the main practical reason to put nginx in front rather than exposing the
# API on its own port.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cesium ships large JS and WASM payloads; compressing them makes a
    # very noticeable difference to first load on venue wifi.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml;

    # ---- API reverse proxy ----
    # proxy_pass without a URI path preserves the full original request URI,
    # so /api/v1/units/... arrives at the backend unchanged.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The ingest endpoint runs the fusion pipeline synchronously and can
        # take a while on a first cold run; don't cut it off at 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI's interactive docs — handy to have live during a demo.
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ---- Static assets ----
    # Cesium's assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- SPA fallback ----
    # Any unmatched path returns index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
